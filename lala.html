<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Login</title>
    <!-- Inter Font for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Split Screen Layout */
        .login-container {
            display: flex;
            width: 100%;
        }

        /* Left Side: Branding/Visual */
        .brand-side {
            flex: 1.2;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            color: #ffffff;
            position: relative;
        }

        .brand-side::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            opacity: 0.05;
        }

        .brand-content {
            position: relative;
            z-index: 1;
            max-width: 500px;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .brand-subtitle {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* Right Side: Form */
        .form-side {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.02);
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: #64748b;
        }

        .form-header a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .form-header a:hover {
            text-decoration: underline;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Toggle Password Eye */
        .toggle-password {
            position: absolute;
            right: 16px;
            left: auto !important;
            cursor: pointer;
            color: #64748b !important;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #0f172a !important;
        }

        /* Form Utilities */
        .form-utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
        }

        .forgot-password {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Primary Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .brand-side {
                display: none;
            }
            .form-side {
                flex: 1;
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Left Side Panel (Hidden on Mobile) -->
        <div class="brand-side">
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="fa-solid fa-layer-group"></i> CoreSystems
                </div>
                <h1 class="brand-title">Simplify your workflow management.</h1>
                <p class="brand-subtitle">Access your unified enterprise dashboard, real-time security analytics, and collaborative team infrastructure tools.</p>
            </div>
        </div>

        <!-- Right Side Login Form -->
        <div class="form-side">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Welcome back</h2>
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </div>

                <form id="loginForm" autocomplete="off">
                    <!-- Email Input -->
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="name@company.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                            <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <!-- Utilities -->
                    <div class="form-utils">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit">Sign in to Account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- UI Interaction Script -->
    <script>
        // Password Visibility Toggle
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle eye icon
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Basic Submit Handling
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted! Connect this handler to your backend auth API.');
        });
    </script>
</body>
</html>
