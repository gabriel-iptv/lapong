<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Login | UI/UX</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f3f4f6;
            --text-main: #111827;
            --text-muted: #6b7280;
            --white: #ffffff;
            --border: #e5e7eb;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 20%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h2 {
            font-size: 1.875rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* Input Styles */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i.prefix-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-size: 1.25rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1px solid var(--border);
            border-radius: 0.625rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .toggle-pass {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
        }

        /* Actions area */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover { text-decoration: underline; }

        /* Buttons */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 0.875rem;
            border: none;
            border-radius: 0.625rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:active { transform: scale(0.98); }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        .btn-google {
            width: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 0.625rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-google:hover { background: #f9fafb; }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Loading State Styling */
        .btn-loading {
            pointer-events: none;
            opacity: 0.8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-card">
        <header>
            <h2>Sign In</h2>
            <p>Welcome back! Enter your credentials.</p>
        </header>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-container">
                    <i class="ph ph-envelope prefix-icon"></i>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <i class="ph ph-lock prefix-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" id="togglePassword" class="toggle-pass">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
            </div>

            <div class="actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary">Sign in</button>

            <div class="divider">or continue with</div>

            <button type="button" class="btn-google">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20" alt="Google">
                Google
            </button>
        </form>

        <p class="footer-text">
            Don't have an account? <a href="#">Sign up for free</a>
        </p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        // Toggle Password Visibility
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            const icon = togglePassword.querySelector('i');
            icon.className = isPassword ? 'ph ph-eye-slash' : 'ph ph-eye';
        });

        // Form Submission Simulation
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Add loading state
            const originalText = submitBtn.innerText;
            submitBtn.classList.add('btn-loading');
            submitBtn.innerHTML = `<div class="spinner"></div> Signing in...`;
            
            // Simulate API call
            setTimeout(() => {
                submitBtn.classList.remove('btn-loading');
                submitBtn.innerText = "Success!";
                submitBtn.style.background = "#10b981"; // Success green

                setTimeout(() => {
                    alert("Login Successful!");
                    submitBtn.innerText = originalText;
                    submitBtn.style.background = ""; // Reset to CSS variable
                }, 1000);
            }, 2000);
        });
    </script>
</body>
</html>
